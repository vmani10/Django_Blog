{% extends "blog/base.html" %}

{% block title %}Edit Post | DjangoBlog{% endblock %}

{% block content %}

<style>

    .form-page {
        min-height: 100vh;
        background: #f7f8fa;
        padding: 50px 0 80px;
    }

    .form-card {
        background: white;
        max-width: 850px;
        margin: auto;
        padding: 40px;
        border-radius: 18px;
        border: 1px solid #e5e7eb;
    }

    .form-title {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 30px;
    }

    .form-label {
        font-weight: 700;
        margin-bottom: 8px;
    }

    .form-control {
        border-radius: 8px;
        padding: 12px;
    }

    textarea.form-control {
        min-height: 300px;
        resize: vertical;
    }

    .current-image {
        width: 180px;
        height: 120px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 15px;
    }

    .submit-btn {
        background: #111827;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 700;
    }

    .submit-btn:hover {
        background: #374151;
    }

    .cancel-btn {
        display: inline-block;
        padding: 11px 20px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        color: #374151;
        text-decoration: none;
        font-weight: 600;
        margin-left: 8px;
    }

</style>


<div class="form-page">

    <div class="container">

        <div class="form-card">

            <h1 class="form-title">
                Edit Post
            </h1>


            <form
                method="POST"
                enctype="multipart/form-data">

                {% csrf_token %}


                <div class="mb-4">

                    <label
                        class="form-label"
                        for="title">

                        Title

                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-control"
                        value="{{ post.title }}"
                        required>

                </div>


                <div class="mb-4">

                    <label
                        class="form-label"
                        for="content">

                        Content

                    </label>

                    <textarea
                        id="content"
                        name="content"
                        class="form-control"
                        required>{{ post.content }}</textarea>

                </div>


                {% if post.image %}

                    <div class="mb-3">

                        <label class="form-label">
                            Current Image
                        </label>

                        <br>

                        <img
                            src="{{ post.image.url }}"
                            alt="{{ post.title }}"
                            class="current-image">

                    </div>

                {% endif %}


                <div class="mb-4">

                    <label
                        class="form-label"
                        for="image">

                        Change Image

                    </label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        class="form-control">

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Update Post

                </button>


                <a
                    href="{% url 'post_detail' post.slug %}"
                    class="cancel-btn">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
