{% extends "blog/base.html" %}

{% block title %}
Create Post | DjangoBlog
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Create New Post
                    </h2>


                    <form
                        method="POST"
                        enctype="multipart/form-data">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Enter post title"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Content
                            </label>

                            <textarea
                                name="content"
                                class="form-control"
                                rows="10"
                                placeholder="Write your blog..."
                                required>
                            </textarea>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Featured Image
                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control"
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-dark">

                            Publish Post

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
